<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - DécliTech Academy</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../main.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a class="logo" href="index.html">DécliTech Academy</a>
      <div class="menu">
        <a href="index.html">Accueil</a>
        <a href="courses.html">Formations</a>
        <a href="schedule.html">Planning</a>
        <a href="teachers.html">Formateurs</a>
        <a href="events.html">Événements</a>
        <a class="nav-cta" href="register.html">Inscription</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="register-layout">
      <div>
        <p class="label">Inscription</p>
        <h1>Rejoindre DécliTech Academy</h1>
        <p>Le formulaire permet de pratiquer les champs texte, email, liste déroulante et zone de message.</p>
      </div>

      <form>
        <label for="name">Nom de l'élève</label>
        <input type="text" id="name" placeholder="Nom complet">

        <label for="age">Âge</label>
        <input type="number" id="age" placeholder="Exemple: 14">

        <label for="email">Email du parent</label>
        <input type="email" id="email" placeholder="parent@email.com">

        <label for="course">Formation souhaitée</label>
        <select id="course">
          <option>HTML & CSS</option>
          <option>Python Junior</option>
          <option>Design UI</option>
          <option>Robotique</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Votre message"></textarea>

        <button type="submit">Envoyer l'inscription</button>
      </form>
    </section>
  </main>

  <footer>
    <p>DécliTech Academy - Projet HTML/CSS multipage</p>
  </footer>
</body>
</html>
