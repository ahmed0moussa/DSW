<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Activités - DécliTech</title>
    <script src="main.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #288B8B;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
        }

        header img {
            height: 50px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        .selection-title {
            color: #288B8B;
            margin-top: 30px;
        }

        .selection-list {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 30px;
        }

        .selection-card {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            border-top: 6px solid #288B8B;
        }

        .selection-card:hover {
            transform: scale(1.05);
        }

        .selection-card h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #288B8B;
        }

        .selection-card p {
            margin: 0;
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }

        .selection-card .age-badge {
            display: inline-block;
            background-color: #288B8B;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .selection-card.orange {
            border-top-color: #E67E22;
        }

        .selection-card.orange h2 {
            color: #E67E22;
        }

        .selection-card.orange .age-badge {
            background-color: #E67E22;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://decli.tech/assets/images/logo/logo%20h.png" alt="Logo DécliTech">
        <h1>Mes Activités</h1>
    </header>

    <main>
        <h2 class="selection-title">Choisissez votre groupe</h2>

        <div class="selection-list">
            <a href="groupe_7_13.html" class="selection-card">
                <span class="age-badge">7 - 13 ans</span>
                <h2>Groupe 7-13 ans</h2>
                <p>36 projets HTML et CSS pour les plus jeunes</p>
            </a>

            <a href="groupe_13_17.html" class="selection-card orange">
                <span class="age-badge">13 - 17 ans</span>
                <h2>Groupe 13-17 ans</h2>
                <p>Activités et projets avancés pour les ados</p>
            </a>
        </div>
    </main>
</body>
</html>
