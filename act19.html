<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activité 19</title>
<link rel="stylesheet" href="act19.css">
<script src="main.js"></script>
</head>
<body>

<div class="container">
    <h1>Mini Project : Photo Gallery</h1>

    <div class="resource-box">
        utilisez <a href="https://www.w3schools.com/css/css_image_gallery.asp" target="_blank">W3Schools</a>
    </div>

    <p class="hint">Objectif : creer une galerie d'images responsive avec CSS Grid et un effet hover.</p>

    <div class="gallery">
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=600&q=80" alt="Classe">
            <div class="caption">Classe</div>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=600&q=80" alt="Equipe">
            <div class="caption">Equipe</div>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80" alt="Code">
            <div class="caption">Code</div>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=600&q=80" alt="Atelier">
            <div class="caption">Atelier</div>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=600&q=80" alt="Presentation">
            <div class="caption">Presentation</div>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" alt="Projet">
            <div class="caption">Projet</div>
        </div>
    </div>

    <div class="challenge">
        <h2>Challenge</h2>
        <p>Changez les images, les captions, le nombre de colonnes et l'effet hover.</p>
    </div>
</div>

</body>
</html>
