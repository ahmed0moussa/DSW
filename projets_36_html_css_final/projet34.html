<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet 18 - Grille responsive</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; color: #222; }
        .retour { display: inline-block; margin: 18px; color: #288B8B; font-weight: bold; text-decoration: none; }
        h1 { text-align: center; color: #288B8B; } .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 30px; } .grid div { background: white; padding: 45px; text-align: center; border-radius: 8px; box-shadow: 0 2px 8px #ccc; } @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <a class="retour" href="index.html">Retour a l'index</a>

    <h1>Galerie responsive</h1><main class="grid"><div>Carte 1</div><div>Carte 2</div><div>Carte 3</div><div>Carte 4</div><div>Carte 5</div><div>Carte 6</div></main>
</body>
</html>
