<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet 15 - Formulaire stylise</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; color: #222; }
        .retour { display: inline-block; margin: 18px; color: #288B8B; font-weight: bold; text-decoration: none; }
        main { max-width: 520px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 3px 10px #ccc; } h1 { color: #288B8B; } label { display: block; margin-top: 12px; font-weight: bold; } input, textarea { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; } button { margin-top: 15px; background: #288B8B; color: white; border: 0; padding: 12px 18px; border-radius: 6px; }
    </style>
</head>
<body>
    <a class="retour" href="index.html">Retour a l'index</a>

    <main><h1>Contact</h1><form><label>Nom</label><input type="text"><label>Email</label><input type="email"><label>Message</label><textarea></textarea><button>Envoyer</button></form></main>
</body>
</html>
