<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet 19 - Site multi-sections responsive</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; color: #222; }
        .retour { display: inline-block; margin: 18px; color: #288B8B; font-weight: bold; text-decoration: none; }
        header { background: #288B8B; color: white; padding: 25px; text-align: center; } nav a { color: white; margin: 10px; } section { padding: 25px; max-width: 900px; margin: auto; } .work { display: flex; gap: 20px; } .work div { flex: 1; background: white; padding: 35px; text-align: center; border-radius: 8px; } @media (max-width: 700px) { .work { flex-direction: column; } nav a { display: block; margin: 8px; } }
    </style>
</head>
<body>
    <a class="retour" href="index.html">Retour a l'index</a>

    <header><h1>Studio Creatif</h1><nav><a href="#about">A propos</a><a href="#work">Travaux</a><a href="#contact">Contact</a></nav></header>
    <section id="about"><h2>A propos</h2><p>Nous creons des sites simples, beaux et responsives.</p></section>
    <section id="work" class="work"><div>Logo</div><div>Site</div><div>Affiche</div></section>
    <section id="contact"><h2>Contact</h2><p>studio@example.com</p></section>
</body>
</html>
