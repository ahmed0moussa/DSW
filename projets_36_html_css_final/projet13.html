<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Projet 13 - Box model</title>
    <style>
        .boite {
            width: 300px;
            padding: 20px;
            margin: 20px;
            border: 3px solid #288B8B;
            background-color: #f4f4f9;
        }

        .rouge {
            border-color: red;
            background-color: #ffecec;
        }

        .verte {
            border-color: green;
            background-color: #ecffec;
        }

        img {
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Explorons le Box Model</h1>

    <div class="boite">
        <h2>Chat joueur</h2>
        <img src="https://cdn.britannica.com/70/234870-050-D4D024BB/Orange-colored-cat-yawns-displaying-teeth.jpg" alt="Chat joueur">
        <p>Cette boite utilise une largeur, un padding, une marge et une bordure.</p>
    </div>

    <div class="boite rouge">
        <h2>Chat endormi</h2>
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg" alt="Chat endormi">
        <p>Cette boite utilise une bordure rouge et une couleur de fond differente.</p>
    </div>

    <div class="boite verte">
        <h2>Chat curieux</h2>
        <img src="https://static.vecteezy.com/ti/photos-gratuite/p1/16281181-un-chat-curieux-marche-prudemment-sous-la-chaise-et-regarde-avec-enthousiasme-avec-ses-yeux-verts-photo.jpg" alt="Chat curieux">
        <p>Cette boite montre une autre variation du box model.</p>
    </div>
</body>
</html>
