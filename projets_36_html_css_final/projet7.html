<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Projet 7 - Tableau illustre</title>
</head>
<body>
    <h1>Mes jeux preferes</h1>

    <table border="1">
        <tr>
            <th>Nom du jeu</th>
            <th>Type</th>
            <th>Image</th>
        </tr>
        <tr>
            <td>Minecraft</td>
            <td>Jeu de construction</td>
            <td><img src="https://upload.wikimedia.org/wikipedia/en/thumb/b/b6/Minecraft_2024_cover_art.png/250px-Minecraft_2024_cover_art.png" alt="Minecraft" width="100"></td>
        </tr>
        <tr>
            <td>Roblox</td>
            <td>Jeu en ligne</td>
            <td><img src="https://m.media-amazon.com/images/I/8142--n1fAL._UF1000,1000_QL80_.jpg" alt="Roblox" width="100"></td>
        </tr>
        <tr>
            <td>Football</td>
            <td>Sport</td>
            <td><img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" alt="Ballon de football" width="100"></td>
        </tr>
    </table>
</body>
</html>
