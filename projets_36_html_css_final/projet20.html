<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet 4 - Carte produit</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; color: #222; }
        .retour { display: inline-block; margin: 18px; color: #288B8B; font-weight: bold; text-decoration: none; }
        .product { max-width: 780px; margin: 35px auto; display: flex; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px #ccc; } .product img { width: 45%; object-fit: cover; } .product div { padding: 25px; } .price { color: #288B8B; font-size: 28px; font-weight: bold; } button { background: #288B8B; color: white; border: 0; padding: 12px 18px; border-radius: 6px; }
    </style>
</head>
<body>
    <a class="retour" href="index.html">Retour a l'index</a>

    <main class="product">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80" alt="Ordinateur portable">
        <div>
            <h1>Ordinateur Etudiant</h1>
            <p>Un ordinateur leger pour apprendre, coder et creer.</p>
            <p class="price">950 DT</p>
            <button>Commander</button>
        </div>
    </main>
</body>
</html>
