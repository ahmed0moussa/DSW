<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Projet 9 - Formulaire valide</title>
</head>
<body>
    <h1>Formulaire de contact</h1>

    <form>
        <label for="prenom">Prenom :</label><br>
        <input type="text" id="prenom" name="prenom" required maxlength="15" placeholder="Ex: Sami"><br><br>

        <label for="age">Age :</label><br>
        <input type="number" id="age" name="age" required min="8" max="18"><br><br>

        <label for="email">Email :</label><br>
        <input type="email" id="email" name="email" required placeholder="exemple@email.com"><br><br>

        <label for="sujet">Sujet :</label><br>
        <select id="sujet" name="sujet" required>
            <option value="">-- Choisir --</option>
            <option value="question">Question</option>
            <option value="inscription">Inscription</option>
            <option value="autre">Autre</option>
        </select><br><br>

        <label for="message">Message :</label><br>
        <textarea id="message" name="message" required rows="5" cols="40" placeholder="Ecris ton message"></textarea><br><br>

        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
