<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet 6 - Galerie simple</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; color: #222; }
        .retour { display: inline-block; margin: 18px; color: #288B8B; font-weight: bold; text-decoration: none; }
        h1 { text-align: center; color: #288B8B; } .gallery { max-width: 900px; margin: 30px auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; } .gallery img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <a class="retour" href="index.html">Retour a l'index</a>

    <h1>Galerie de photos</h1>
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=500&q=80" alt="Paysage">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80" alt="Mer">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=500&q=80" alt="Foret">
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=500&q=80" alt="Montagne">
    </div>
</body>
</html>
