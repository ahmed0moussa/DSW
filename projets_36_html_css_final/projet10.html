<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Projet 10 - Navigation interne</title>
</head>
<body>
    <header>
        <h1>Ma page interactive</h1>
    </header>

    <nav>
        <a href="#presentation">Presentation</a> |
        <a href="#media">Medias</a> |
        <a href="#contact">Contact</a>
    </nav>

    <section id="presentation">
        <h2>Presentation</h2>
        <p>Bonjour ! Je m'appelle Sami et j'adore creer des pages web.</p>
        <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" alt="Ordinateur" width="180">
    </section>

    <section id="media">
        <h2>Medias</h2>
        <p>Voici une image qui represente le monde du web.</p>
        <img src="https://cdn-icons-png.flaticon.com/512/841/841364.png" alt="Web" width="160">
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <form>
            <label for="prenom">Ton prenom :</label>
            <input type="text" id="prenom" name="prenom">
            <button type="submit">Envoyer</button>
        </form>
    </section>

    <footer>
        <p>Page creee en HTML.</p>
    </footer>
</body>
</html>
