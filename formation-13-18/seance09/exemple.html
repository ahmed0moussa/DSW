<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival des jeunes talents</title>
  <link rel="stylesheet" href="exemple.css">
</head>
<body>

  <header class="banniere">
    <h1>Festival des jeunes talents</h1>
    <p>Musique · Danse · Théâtre — du 12 au 14 juillet</p>
    <a class="bouton" href="#programme">Voir le programme</a>
  </header>

  <main id="programme">
    <h2>Le programme</h2>
    <div class="photos">
      <figure>
        <img src="https://picsum.photos/seed/musique/400/300" alt="Concert de musique">
        <figcaption>Vendredi : musique</figcaption>
      </figure>
      <figure>
        <img class="sepia" src="https://picsum.photos/seed/danse/400/300" alt="Spectacle de danse">
        <figcaption>Samedi : danse</figcaption>
      </figure>
      <figure>
        <img class="termine" src="https://picsum.photos/seed/theatre/400/300" alt="Pièce de théâtre">
        <figcaption>Dimanche : théâtre (complet)</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>Maison des jeunes · Entrée gratuite</p>
  </footer>

</body>
</html>
