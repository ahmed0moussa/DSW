<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · Club Nature</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a class="logo" href="index.html">🌿 Club Nature</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="activites.html">Activités</a>
      <a href="contact.html" class="actif">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Nous contacter</h1>
    <form>
      <label for="nom">Ton prénom</label>
      <input type="text" id="nom" required>

      <label for="email">Ton email</label>
      <input type="email" id="email" required>

      <label for="message">Ton message</label>
      <textarea id="message" rows="5" required></textarea>

      <button type="submit" class="bouton">Envoyer</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Club Nature des jeunes · Fait avec HTML et CSS</p>
  </footer>

</body>
</html>
