<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte profil et galerie</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="exemple.css">
</head>
<body>

  <main>
    <article class="profil">
      <div class="profil-haut"></div>
      <img class="avatar" src="https://picsum.photos/seed/avatar-sara/300/300" alt="Photo de Sara">
      <h1>Sara</h1>
      <p class="metier">Future développeuse web</p>
      <p>J'aime la photo, les voyages et créer des pages web jolies et utiles.</p>
      <ul class="competences">
        <li>HTML</li>
        <li>CSS</li>
        <li>Photo</li>
        <li>Design</li>
      </ul>
      <a class="bouton" href="#galerie">Voir mes photos</a>
    </article>

    <h2 id="galerie">Mes photos de voyage</h2>
    <section class="galerie">
      <figure><img src="https://picsum.photos/seed/voy1/500/400" alt="Coucher de soleil"><figcaption>Coucher de soleil</figcaption></figure>
      <figure><img src="https://picsum.photos/seed/voy2/500/400" alt="Montagne"><figcaption>Montagne</figcaption></figure>
      <figure><img src="https://picsum.photos/seed/voy3/500/400" alt="Ville"><figcaption>Ville la nuit</figcaption></figure>
      <figure><img src="https://picsum.photos/seed/voy4/500/400" alt="Forêt"><figcaption>Forêt</figcaption></figure>
      <figure><img src="https://picsum.photos/seed/voy5/500/400" alt="Mer"><figcaption>Bord de mer</figcaption></figure>
      <figure><img src="https://picsum.photos/seed/voy6/500/400" alt="Désert"><figcaption>Désert</figcaption></figure>
    </section>
  </main>

</body>
</html>
