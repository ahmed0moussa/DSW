<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique interactive</title>
  <link rel="stylesheet" href="exemple.css">
</head>
<body>

  <nav>
    <a href="#">Accueil</a>
    <div class="menu">
      <a href="#">Jeux ▾</a>
      <div class="sous-menu">
        <a href="#">Aventure</a>
        <a href="#">Sport</a>
        <a href="#">Réflexion</a>
      </div>
    </div>
    <a href="#">Scores</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <h1>Les boutons</h1>
    <button class="btn couleur">Couleur</button>
    <button class="btn arrondi">Arrondi</button>
    <button class="btn ombre">Ombre</button>
    <button class="btn contour">Contour</button>

    <h1>Les cartes</h1>
    <div class="cartes">
      <div class="carte">
        <img src="https://picsum.photos/seed/jeu-aventure/400/260" alt="Jeu d'aventure">
        <h2>Aventure</h2>
      </div>
      <div class="carte">
        <img src="https://picsum.photos/seed/jeu-sport/400/260" alt="Jeu de sport">
        <h2>Sport</h2>
      </div>
      <div class="carte">
        <img src="https://picsum.photos/seed/jeu-reflexion/400/260" alt="Jeu de réflexion">
        <h2>Réflexion</h2>
      </div>
    </div>

    <h1>Le tableau des scores</h1>
    <table>
      <tr><th>Joueur</th><th>Points</th></tr>
      <tr><td>Nour</td><td>980</td></tr>
      <tr><td>Amine</td><td>870</td></tr>
      <tr><td>Lina</td><td>860</td></tr>
      <tr><td>Youssef</td><td>720</td></tr>
    </table>

    <h1>Le champ qui réagit</h1>
    <input type="text" placeholder="Clique ici pour écrire">
  </main>

</body>
</html>
